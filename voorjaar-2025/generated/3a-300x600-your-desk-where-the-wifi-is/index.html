<html>
	<head>
		<meta charset='utf-8' />
		<meta http-equiv='X-UA-Compatible' content='IE=edge' />
		<meta name='ad.size' content='width=300,height=600' />
		<title>ING Banners: 300x600</title>
		<link rel='stylesheet' href='src/style.css' />
			<link rel='stylesheet' href='src/narrow.css' />

		<!-- clickTag url-->
		<script type='text/javascript'>
			var clickTag = 'https://www.ing.nl/careers';
		</script>
	</head>

	<body>
		<div id='ad' style='width: 300px; height: 600px'>
			<div
				id='banner'
				data-width='300'
				data-height='600'
				style='width: 300px; height: 600px'
			>
				<div class='slide image'>
					<img src='src/image_scaled.jpg' alt='' />
				</div>
				<div class='slide content' style='padding: 18px'>
					<div
						class='logo'
						style='width: 34px; height: 34px'
					>
						<img class='logo-white' src='src/id.svg' alt='' />
					</div>
					<div class='text' style='font-size: 36px'>
							<span>Your desk</span>
							<span>where the wifi is</span>
					</div>
					<div
						class='button'
						style='font-size: 16px'
					>ing.nl/careers</div>
				</div>

				<div class='outerBorder'></div>

				<!-- Fallback & clickTag -->
				<a
					href='javascript:void(0);'
					onClick='window.open(window.clickTag)'
					class='clicktag'
				>
					<!--[if lte IE 8]>
						<img src="fallback.jpg" alt="" class="fallback" />
					<![endif]-->
				</a>
			</div>
		</div>
		<script
			src='https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.2.4_min.js'
		></script>
		<script
			src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js'
		></script>

			<script src='src/narrow.js'></script>
	</body>
</html>
