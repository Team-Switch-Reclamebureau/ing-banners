<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="ad.size" content="width=300,height=600">
    <title>ING Banners: 300x600</title>
    <link rel="stylesheet" href="src/style.css">

    <!-- clickTag url-->
    <script type="text/javascript">
        var clickTag = "https://www.ing.nl/careers";
    </script>
</head>

<body>
    <div id="ad">
        <div id="banner">
            <div class="slide slide-1">
                <div class="text">
                    <span>Uncovering</span>
                    <span>dirty money</span>
                </div>
                <div class="disclaimer"></div>
                <div class="image">
                    <img src="src/image1_scaled.jpg" alt="">
                </div>
            </div>
            <div class="slide slide-2">
                <span class="text orange">
                    <span class="orange">
                        <div class="bg"></div>
                        <k>Make</k>
                        <k>it</k>
                        <k>your</k>
                        <k>job</k>
                    </span>
                    <span class="purple">
                        ing.nl/careers
                    </span>
                </span>
                <div class="image">
                    <img src="src/image2_scaled.jpg" alt="">
                </div>
            </div>
            <div class="slide slide-extra">
                <span class="text orange">
                    <span class="">
                        <div class="bg"></div>
                        <k>Apply</k>
                        <k>now</k>
                    </span>
                </span>
            </div>
            
            <div class="logo">
                <img class="logo-orange" src="src/id.png" alt="">
                <img class="logo-white"  src="src/id_white.png" alt="">
            </div>

            <div class="outerBorder"></div>

            <!-- Fallback & clickTag -->
            <a href="javascript:void(0);" onClick="window.open(window.clickTag)" class="clicktag">
                <!--[if lte IE 8]> <img src="fallback.jpg" alt="" class="fallback"> <![endif]-->
            </a>

        </div><!-- // End Banner Div -->
    </div> <!-- // End Ad Div -->
    <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.2.4_min.js"></script>
    <!-- <script src="http://localhost:5500/bronnen/js/gsap_3.2.4_min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- <script src="http://localhost:5500/bronnen/js/jquery_3.4.1.min.js"></script> -->
    <script src="src/script.js"></script>
</body>

</html>
