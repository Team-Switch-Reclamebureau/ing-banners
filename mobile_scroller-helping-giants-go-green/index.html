	<script>
		window.requestAnimationFrame = window.requestAnimationFrame ||
			window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame ||

		(function() {
			var websiteTop = document.getElementById("website_top");
			var websiteBottom = document.getElementById("website_bottom");
			var websiteBottomContainer = document.getElementById("bottom_container");
			var creativeMain = document.getElementById("creative_main");
			var creativeMainPlaceHolder = document.getElementById("creative_main_placeholder");
			var topBar = document.getElementsByClassName("ad-bar-container")[0];
			var bottomBar = document.getElementsByClassName("ad-bar-container")[1];
			var device = document.getElementsByClassName("device")[0];
			var deviceContentMask = document.getElementsByClassName("device_content_mask")[0];
			var deviceBottom = document.querySelector(".bottom");
			var viewMessage = document.getElementById("view-message");
			var scrollEl;
			var scrollElRect, isUseFullWindow, websitesLoaded = 0;
			var xobj = new XMLHttpRequest();
			var winDimensions = {
				width: 0,
				height: 0
			};
			var topBarTop, creativeMainHeight, barHeight, sizeMain, fixed, unit, config;
			var prevScrollTop = 0;
			/**
			iphone5: 320x488 (with toolbars showing)
			advertiser bar height: 26
			488 - (26 * 2) = 436
			**/
			var ShortestRatio = 32 / 43;

			TweenLite.defaultEase = Power1.easeInOut;
			xobj.overrideMimeType("application/json");
			xobj.open('GET', "banner/config.json", true);
			xobj.onreadystatechange = function() {
				if (xobj.readyState == 4 && xobj.status == "200") {
					config = JSON.parse(xobj.responseText);
					checkPostInfo();
					window.top.addEventListener('message', websiteResizeHandler);
					isUseFullWindow = config.devicesimulator !== "yes";
					scrollEl = isUseFullWindow ? window : document.getElementsByClassName("screen")[0];
					if (!isUseFullWindow) {
						document.getElementsByClassName("device")[0].classList.add("device-simulator");
					}
					sizeMain = config.size.height;
					unit = config.size.unit;
					document.querySelector("#info-display").style.display = config.infopanel === "yes" ? "block" : "none";
					requestAnimationFrame(init);
					var ref = setInterval(function () {
						if (creativeMain.contentWindow.Premium){
							clearInterval(ref);
							creativeMain.contentWindow.Premium.authoring = authoring(creativeMain.contentWindow);
						}
					}, 10);
				}
			};
			xobj.send(null);

			websiteTop.querySelector("IFRAME").addEventListener("load", function() {
				websitesLoaded++;
				checkPostInfo();
			});

			websiteBottom.querySelector("IFRAME").addEventListener("load", function() {
				websitesLoaded++;
				checkPostInfo();
			});

			function checkPostInfo() {
				if (websitesLoaded === 2 && config) {
					websiteTop.querySelector("IFRAME").contentWindow.postMessage({
						format: config.format,
						version:"3.3.6"
					}, '*');
					websiteBottom.querySelector("IFRAME").contentWindow.postMessage({
						format: config.format,
						version:"3.3.6"
					}, '*');
				}
			}

			function websiteResizeHandler(e) {
				var dist = 00;
				websiteTop.style.height = e.data.splitPos + dist / 2 + "px";
				websiteBottom.querySelector("IFRAME").style.marginTop = -(e.data.splitPos + dist) + "px";
				requestAnimationFrame(function() {
					resizeHandler();
				})
			}

			function resizeHandler() {
				winDimensions.width = scrollEl.clientWidth || window.innerWidth || (document.documentElement || document.body).clientWidth;
                winDimensions.height = scrollEl.clientHeight || window.innerHeight || (document.documentElement || document.body).clientHeight;
				if (navigator.appName == 'Microsoft Internet Explorer' ||
					!!(navigator.userAgent.match(/Trident/) ||
						navigator.userAgent.match(/rv:11/))) {
					if ("getBoundingClientRect" in scrollEl) {
						scrollElRect = scrollEl.getBoundingClientRect();
					}
				}
				if (!scrollElRect) {
					scrollElRect = {
						top: scrollEl.offsetTop || 0,
						left: scrollEl.offsetLeft || 0,
						width: winDimensions.width,
						height: winDimensions.height
					};
				}
				scrollElRect.bottom = deviceBottom.clientHeight + parseInt(getComputedStyle(device).paddingBottom);
				if (unit === "percent") {
					creativeMainHeight = (winDimensions.height - barHeight * 2) * sizeMain / 100;
				} else {
					creativeMainHeight = sizeMain;
				}
				creativeMain.style.height = creativeMainHeight + "px";
				topBar.style.width = bottomBar.style.width = creativeMain.style.width = (fixed ? fixed.width : winDimensions.width) + "px";
				var prevMessageText = viewMessage.innerText;
				if (winDimensions.width < winDimensions.height && winDimensions.width / winDimensions.height > ShortestRatio) {
					viewMessage.innerText = "Below shortest ratio screen size!";
				} else {
					viewMessage.innerText = "";
				}
				scrollHandler();
			}



			function scrollHandler() {
				topBarTop = websiteTop.getBoundingClientRect().height;
				var scrollTop = scrollEl.scrollTop || scrollEl.pageYOffset;
				var isDirectionUp = scrollTop > prevScrollTop;
				prevScrollTop = scrollTop;
				if (scrollTop > topBarTop) { // top bar above or at the top
					setBottomBarPosition(true);
					setCreativeMainPosition(false);
					setTopBarPosition(false);
					topBar.style.top = scrollElRect.top + "px";
					topBar.firstElementChild.style.top = Math.min(0, (topBarTop + creativeMainHeight) - scrollTop + barHeight) + "px"
				} else if (scrollTop < (topBarTop + creativeMainHeight + (barHeight * 2)) - winDimensions.height) { // bottom bar below or at the bottom
					setTopBarPosition(true);
					setCreativeMainPosition(false);
					setBottomBarPosition(false);
					creativeMain.style.top = "auto";
					creativeMain.style.bottom = (scrollElRect.bottom + barHeight) + "px";
					bottomBar.style.bottom = scrollElRect.bottom + "px";
					bottomBar.firstElementChild.style.bottom = Math.min(0, (scrollTop + winDimensions.height - barHeight) - topBarTop) + "px";
				} else { // top bar and bottom bar in the middle
					setCreativeMainPosition(true);
					setTopBarPosition(true);
					setBottomBarPosition(true);
					if (isDirectionUp) {
						creativeMain.style.top = "auto";
						creativeMain.style.bottom = scrollElRect.bottom + "px";
					}
				}
				var mainVisible = scrollTop >= (topBarTop - winDimensions.height) && scrollTop <= topBarTop + creativeMainPlaceHolder.offsetHeight
				creativeMain.style.visibility = mainVisible ? "visible" : "hidden";
			}

			function setTopBarPosition(relative) {
				if (relative) {
					topBar.style.position = "relative";
					creativeMainPlaceHolder.style.marginTop = topBar.style.top = topBar.style.left = "auto";
				} else {
					topBar.style.position = "fixed";
					topBar.style.top = scrollElRect.top + "px";
					topBar.style.left = scrollElRect.left + "px";
					creativeMainPlaceHolder.style.marginTop = barHeight + "px";
				}
			}

			function setBottomBarPosition(relative) {
				if (relative) {
					bottomBar.style.position = "relative";
					// bottomBar.style.top = bottomBar.style.left = "auto";
					bottomBar.style.bottom = "0px"
				} else {
					bottomBar.style.position = "fixed";
					// bottomBar.style.top = scrollElRect.top + winDimensions.height - barHeight + "px";
					bottomBar.style.bottom = "0px";
					// bottomBar.style.top = "auto"
					// bottomBar.style.left = scrollElRect.left + "px";
				}
			}

			function setCreativeMainPosition(relative) {
				if (relative) {
					creativeMainPlaceHolder.style.position = "absolute";
					creativeMain.style.top = creativeMain.style.left = creativeMain.style.right = "auto";
					creativeMain.style.position = "relative";
				} else {
					creativeMainPlaceHolder.style.position = "relative"
					creativeMainPlaceHolder.style.height = creativeMainHeight + "px";
					creativeMain.style.top = scrollElRect.top + barHeight + "px";
					creativeMain.style.position = "fixed";
					creativeMain.style.right = "0";
					var scrollbarOffset = scrollEl.clientWidth - scrollEl.offsetWidth;
					scrollbarOffset = isNaN(scrollbarOffset) ? 0 : scrollbarOffset;
					creativeMain.style.left = scrollbarOffset + "px";
				}
			}

			function init() {
				barHeight = topBar.offsetHeight;
				window.jpxApiInterface = {};
				resizeHandler();
				scrollHandler();
				scrollEl.addEventListener("scroll", scrollHandler);
				window.addEventListener("resize", resizeHandler);
			}

		}());
