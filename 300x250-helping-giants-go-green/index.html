<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="ad.size" content="width=300,height=250">
    <title>ING Banners: 300x250</title>
    <link rel="stylesheet" href="css-js/style.css">

    <!-- clickTag url-->
    <script type="text/javascript">
        var clickTag = "https://www.ing.nl/careers";
    </script>
</head>

<body>
    <div id="ad">
        <div id="banner">
            <div class="slide slide-1">
                <div class="text">
                    <span>Helping giants</span>
                    <span>go green</span>
                </div>
                <div class="image">
                    <img src="images/image1_scaled.jpg" alt="">
                </div>
            </div>
            <div class="slide slide-2">
                <span class="text orange">
                    <span class="orange">
                        Make it your job.
                    </span>
                    <span class="purple">
                        ing.nl/careers
                    </span>
                </span>
                <div class="image">
                    <img src="images/image2_scaled.jpg" alt="">
                </div>
            </div>
            <div class="slide slide-3">
                <img src="images/ING_Identifier_FC_Tagline_Orange.png" alt="">
            </div>
            <div class="logo">
                <img src="images/id.png" alt="">
                <span class="logo-border"></span>
                <div class="logo-text">

                </div>
            </div>

            <div class="outerBorder"></div>

            <!-- Fallback & clickTag -->
            <a href="javascript:void(0);" onClick="window.open(window.clickTag)" class="clicktag">
                <!--[if lte IE 8]> <img src="fallback.jpg" alt="" class="fallback"> <![endif]-->
            </a>

        </div><!-- // End Banner Div -->
    </div> <!-- // End Ad Div -->
    <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.2.4_min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!--<script src="css-js/CustomEase3.min.js"></script>-->
    <!-- <script src="css-js/splittext.min.js"></script> -->
    <script src="css-js/script.js"></script>
</body>

</html>
