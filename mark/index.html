<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="ad.size" content="width=300,height=250">
	<title>ING Banners: 300x250</title>
	<link rel="stylesheet" href="css-js/style.css">

	<!-- clickTag url-->
	<script type="text/javascript">
		var clickTag = "https://www.ing.jobs/netherlands/home.htm";
	</script>
</head>

<body>
	<div id="ad">
		<div id="banner">

			<!-- ============== Frame One ============= -->
			<div id="frame_one">

				<div id="intro">
					<img src="images/bg.jpg" alt="" id="introImage">
					<div id="introContainer">

					</div>
				</div>

				<div id="footer" class="footer">
					<div id="footerBg" class="footerBg">
						<div id="footerBgBottom" class="footerBgBottom"></div>
						<div id="footerBgTop_copy1" class="footerBgTop_copy1">
						</div>
					</div>

					<div id="percentage" class="percentage">75%</div>
					<div id="footer_text" class="footer_text">of our IT colleagues agree</div>
				</div>

				<div id="logoOrange" class="logoOrange"></div>

				<div id="endBgContainer" class="endBgContainer">
					<div id="endBg" class="endBg"></div>
					<!-- <div id="footerBgBottomEnd" class="footerBgBottomEnd"></div> -->
				</div>

				<div id="whiteCopyContainer" class="whiteCopyContainer">
					<div id="logoWhiteCopy" class="logoWhiteCopy"></div>
				</div>

				<div id="logoWhite" class="logoWhite"></div>


				<div id="endCopy" class="endCopy">The floor <br>is yours</div>


				<div id="ctaContainer" class="ctaContainer">
					<div id="ctaInnerContainer" class="ctaInnerContainer">
						<div class="cta">ING.nl/careers</div>
					</div>
					<div id="arrow" class="arrow"></div>
				</div>

				<div id="loading" class="loading"></div>

			</div>

			<div class="outerBorder"></div>


			<!-- Fallback & clickTag -->
			<a href="javascript:void(0);" onClick="window.open(window.clickTag)" class="clicktag">
				<!--[if lte IE 8]> <img src="fallback.jpg" alt="" class="fallback"> <![endif]-->
			</a>

		</div><!-- // End Banner Div -->
	</div> <!-- // End Ad Div -->
	<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.2.4_min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
	<!--<script src="css-js/CustomEase3.min.js"></script>-->
	<script src="css-js/splittext.min.js"></script>
	<script src="css-js/custom.js"></script>
</body>

</html>
